<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticiario CIFP La Granja</title>
    <meta name="description" content="Actualidad agraria, ganadera, forestal y agroalimentaria del CIFP La Granja, Cantabria y España, actualizada automáticamente.">
    <link rel="alternate" type="application/rss+xml" title="Noticiario CIFP La Granja" href="feed.xml">
    <link rel="icon" href="logo2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2C5F5F;
            --primary-dark: #1B4D3E;
            --accent: #4CAF50;
            --accent-soft: #E3F2E6;
            --bg: #F1F8F4;
            --card: #ffffff;
            --text: #24474A;
            --text-strong: #1B4D3E;
            --muted: #5f7a80;
            --border: #dfe9e3;
            --shadow-sm: 0 2px 4px rgba(44,95,95,0.06);
            --shadow-lg: 0 10px 20px rgba(44,95,95,0.12);
            --radius: 12px;
            --font: 'Outfit', system-ui, sans-serif;
            /* colores por área */
            --a-agricultura: #7CB342; --a-ganaderia: #8D6E63; --a-forestal: #2E7D32;
            --a-medioambiente: #00897B; --a-jardineria: #C0CA33; --a-alimentarias: #F9A825;
            --a-maquinaria: #546E7A; --a-fp: #5C6BC0; --a-quimica: #0288D1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.55; }
        a { color: inherit; }

        .main-header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 1.25rem 0; box-shadow: 0 4px 6px rgba(44,95,95,.15); }
        .header-content { max-width: 1200px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo-area { display: flex; align-items: center; gap: .9rem; }
        .logo-img { height: 56px; width: auto; }
        .title-group h1 { font-size: 1.7rem; font-weight: 700; line-height: 1.15; }
        .title-group p { font-size: .9rem; opacity: .9; font-weight: 300; }
        .filters { display: flex; gap: .5rem; flex-wrap: wrap; }
        .filter-btn { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #fff; padding: .45rem .95rem; border-radius: 20px; cursor: pointer; font: 600 .9rem var(--font); transition: background .2s, transform .2s; }
        .filter-btn .count { opacity: .75; font-weight: 400; margin-left: .2rem; }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--primary-dark); transform: translateY(-1px); }

        .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }
        .toolbar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; background: var(--card); padding: .9rem 1rem; border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 1rem; }
        .toolbar label { font-weight: 600; color: var(--text-strong); }
        .toolbar select, .toolbar input { padding: .5rem .6rem; border-radius: 8px; border: 1px solid #c9d6cf; font: 1rem var(--font); background: #fff; color: var(--text); min-width: 0; }
        .toolbar select { flex: 0 1 260px; }
        .toolbar input { flex: 1 1 220px; }
        .status { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; font-size: .85rem; color: var(--muted); margin-bottom: 1.25rem; }
        .rss-link { display: inline-flex; align-items: center; gap: .35rem; color: #E65100; font-weight: 600; text-decoration: none; }
        .rss-link:hover { text-decoration: underline; }

        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.5rem; }
        .news-card { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); transition: transform .25s, box-shadow .25s; display: flex; flex-direction: column; border-top: 4px solid var(--area-color, var(--accent)); }
        .news-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .card-image { height: 160px; position: relative; overflow: hidden; background: linear-gradient(135deg, var(--area-color, var(--accent)), var(--primary)); display: flex; align-items: center; justify-content: center; }
        .card-image.noimg { height: 96px; }
        .card-image.noimg svg { width: 44px; height: 44px; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-image svg { width: 64px; height: 64px; color: rgba(255,255,255,.85); }
        .card-badge { position: absolute; top: .75rem; left: .75rem; background: rgba(255,255,255,.93); color: var(--text-strong); padding: .2rem .65rem; border-radius: 12px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
        .card-content { padding: 1.1rem 1.25rem 1.25rem; flex-grow: 1; display: flex; flex-direction: column; }
        .card-meta { display: flex; justify-content: space-between; gap: .5rem; font-size: .8rem; color: var(--muted); margin-bottom: .4rem; }
        .news-scope { font-weight: 700; text-transform: uppercase; color: var(--primary); }
        .news-scope.cifp { color: #E65100; }
        .card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-strong); line-height: 1.3; margin-bottom: .6rem; }
        .card-title a { text-decoration: none; }
        .card-title a:hover { text-decoration: underline; }
        .card-summary { font-size: .93rem; margin-bottom: 1rem; flex-grow: 1; }
        .card-footer { border-top: 1px solid var(--border); padding-top: .8rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-top: auto; }
        .source { font-size: .8rem; font-weight: 600; color: var(--primary); background: var(--accent-soft); padding: .2rem .5rem; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
        .read-more { color: var(--primary); text-decoration: none; font-weight: 600; font-size: .9rem; white-space: nowrap; }
        .read-more:hover { text-decoration: underline; }

        .message { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 3rem 1rem; }
        .more-wrap { text-align: center; margin-top: 2rem; }
        .more-btn { background: var(--primary); color: #fff; border: 0; padding: .7rem 1.6rem; border-radius: 24px; font: 600 1rem var(--font); cursor: pointer; }
        .more-btn:hover { background: var(--primary-dark); }

        .main-footer { background: var(--primary-dark); color: #fff; text-align: center; padding: 1.75rem 1rem; margin-top: 3rem; font-size: .9rem; }
        .main-footer p + p { opacity: .75; margin-top: .4rem; font-size: .8rem; }

        @media (max-width: 768px) {
            .header-content { flex-direction: column; align-items: stretch; }
            .filters { justify-content: center; }
            .toolbar select, .toolbar input { flex: 1 1 100%; }
            .title-group h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo-area">
                <img src="logo2.png" alt="CIFP La Granja" class="logo-img">
                <div class="title-group">
                    <h1>Noticiario La Granja</h1>
                    <p>Agricultura, ganadería, forestal y alimentación · CIFP, Cantabria y España</p>
                </div>
            </div>
            <nav class="filters" aria-label="Ámbito">
                <button class="filter-btn active" data-scope="all">Todas<span class="count"></span></button>
                <button class="filter-btn" data-scope="cifp">CIFP La Granja<span class="count"></span></button>
                <button class="filter-btn" data-scope="cantabria">Cantabria<span class="count"></span></button>
                <button class="filter-btn" data-scope="nacional">Nacional<span class="count"></span></button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="toolbar">
            <label for="area-select">Área:</label>
            <select id="area-select"><option value="all">Todas las áreas</option></select>
            <input id="search" type="search" placeholder="Buscar en titulares…" aria-label="Buscar">
        </div>
        <div class="status">
            <span id="updated">Cargando noticias…</span>
            <a class="rss-link" href="feed.xml" title="Suscribirse con un lector RSS">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="19" r="2.5"/><path d="M2.5 9.5v3a9 9 0 0 1 9 9h3a12 12 0 0 0-12-12zm0-6v3a15 15 0 0 1 15 15h3a18 18 0 0 0-18-18z"/></svg>
                Suscribirse por RSS
            </a>
        </div>
        <div id="news-grid" class="news-grid" aria-live="polite"></div>
        <div class="more-wrap"><button id="more" class="more-btn" hidden>Ver más noticias</button></div>
    </main>

    <footer class="main-footer">
        <p>&copy; <span id="year"></span> CIFP La Granja · Heras (Medio Cudeyo, Cantabria)</p>
        <p>Noticias recopiladas automáticamente de medios de comunicación; el contenido pertenece a cada fuente.</p>
    </footer>

    <script>
    (() => {
        const PAGE = 24;
        const SCOPES = { cifp: 'CIFP La Granja', cantabria: 'Cantabria', nacional: 'Nacional' };
        // iconos sencillos por área (trazos SVG)
        const ICONS = {
            agricultura: '<path d="M12 22V10M12 10c0-4 3-7 7-7 0 4-3 7-7 7zm0 4c0-4-3-7-7-7 0 4 3 7 7 7z"/>',
            ganaderia: '<path d="M4 8l3-3h10l3 3M6 8v6a6 6 0 0 0 12 0V8M9 13h.01M15 13h.01M10 17h4"/>',
            forestal: '<path d="M12 2l6 9h-4l5 7H5l5-7H6zM12 18v4"/>',
            medioambiente: '<path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 16-9 0 12-4 16-9 16zM4 20c4-4 7-6 10-8"/>',
            jardineria: '<circle cx="12" cy="8" r="3"/><path d="M12 11v11M12 5V2M9 8H6M18 8h-3M8 18c2 0 4-1 4-4M16 18c-2 0-4-1-4-4"/>',
            alimentarias: '<path d="M3 11h18l-2 9H5zM8 11V7a4 4 0 0 1 8 0v4"/>',
            maquinaria: '<circle cx="7" cy="17" r="3"/><circle cx="18" cy="18" r="2"/><path d="M4 14V8h7l2 6h6v4M11 8V5h4"/>',
            quimica: '<path d="M9 3h6M10 3v6L4 19a1.5 1.5 0 0 0 1.3 2h13.4a1.5 1.5 0 0 0 1.3-2L14 9V3M7 15h10"/>',
            fp: '<path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5M22 9v6"/>'
        };

        const grid = document.getElementById('news-grid');
        const areaSelect = document.getElementById('area-select');
        const search = document.getElementById('search');
        const moreBtn = document.getElementById('more');
        const scopeBtns = document.querySelectorAll('.filter-btn');
        document.getElementById('year').textContent = new Date().getFullYear();

        let news = [], areas = {}, scope = 'all', area = 'all', query = '', shown = PAGE;

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
        const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

        function relDate(iso) {
            const d = new Date(iso), diff = (Date.now() - d) / 36e5;
            if (diff < 1) return 'hace menos de 1 h';
            if (diff < 24) return `hace ${Math.floor(diff)} h`;
            if (diff < 48) return 'ayer';
            if (diff < 24 * 7) return `hace ${Math.floor(diff / 24)} días`;
            return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function filtered() {
            const q = norm(query.trim());
            return news.filter(n =>
                (scope === 'all' || n.ambito === scope) &&
                (area === 'all' || n.area === area) &&
                (!q || norm(n.titulo + ' ' + n.resumen + ' ' + n.fuente).includes(q)));
        }

        function card(n) {
            const color = `var(--a-${n.area}, var(--accent))`;
            const img = n.imagen
                ? `<img src="${esc(n.imagen)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
                : '';
            const icon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n.area] || ICONS.agricultura}</svg>`;
            const url = esc(safeUrl(n.url));
            return `<article class="news-card" style="--area-color:${color}">
                <div class="card-image${img ? '' : ' noimg'}">${img || icon}<span class="card-badge">${esc(areas[n.area] || n.area)}</span></div>
                <div class="card-content">
                    <div class="card-meta">
                        <span class="news-scope ${esc(n.ambito)}">${esc(SCOPES[n.ambito] || n.ambito)}</span>
                        <time datetime="${esc(n.fecha)}" title="${esc(new Date(n.fecha).toLocaleString('es-ES'))}">${esc(relDate(n.fecha))}</time>
                    </div>
                    <h3 class="card-title"><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(n.titulo)}</a></h3>
                    <p class="card-summary">${esc(n.resumen)}</p>
                    <div class="card-footer">
                        <span class="source" title="${esc(n.fuente)}">${esc(n.fuente)}</span>
                        <a href="${url}" target="_blank" rel="noopener noreferrer" class="read-more">Leer en la fuente &rarr;</a>
                    </div>
                </div>
            </article>`;
        }

        function render() {
            const list = filtered();
            if (!list.length) {
                grid.innerHTML = `<p class="message">No hay noticias que coincidan con los filtros.</p>`;
                moreBtn.hidden = true;
                return;
            }
            grid.innerHTML = list.slice(0, shown).map(card).join('');
            moreBtn.hidden = list.length <= shown;
        }

        function updateCounts() {
            scopeBtns.forEach(b => {
                const s = b.dataset.scope;
                const c = news.filter(n => (s === 'all' || n.ambito === s) && (area === 'all' || n.area === area)).length;
                b.querySelector('.count').textContent = ` (${c})`;
            });
        }

        scopeBtns.forEach(btn => btn.addEventListener('click', () => {
            scopeBtns.forEach(b => b.classList.toggle('active', b === btn));
            scope = btn.dataset.scope; shown = PAGE; render();
        }));
        areaSelect.addEventListener('change', e => { area = e.target.value; shown = PAGE; updateCounts(); render(); });
        let t; search.addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { query = e.target.value; shown = PAGE; render(); }, 150); });
        moreBtn.addEventListener('click', () => { shown += PAGE; render(); });

        fetch('news.json?v=' + Date.now())
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(data => {
                news = (data.noticias || []).sort((a, b) => b.fecha.localeCompare(a.fecha));
                areas = data.areas || {};
                for (const [k, v] of Object.entries(areas)) areaSelect.add(new Option(v, k));
                const up = data.actualizado ? new Date(data.actualizado) : null;
                document.getElementById('updated').textContent = up
                    ? `${news.length} noticias · actualizado ${relDate(data.actualizado)} (${up.toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })})`
                    : `${news.length} noticias`;
                updateCounts(); render();
            })
            .catch(() => {
                document.getElementById('updated').textContent = 'No se han podido cargar las noticias.';
                grid.innerHTML = `<p class="message">Todavía no hay noticias disponibles. Se generan automáticamente cada pocas horas.</p>`;
            });
    })();
    </script>
</body>
</html>
